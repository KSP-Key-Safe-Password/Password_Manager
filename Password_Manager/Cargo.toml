[package]
name = "Password_Manager"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = "0.13.1"
rand = { version = "0.8", features = ["std"] }
arboard = "3.3"

mongodb = "3"
scylla = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
